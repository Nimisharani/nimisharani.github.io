<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d">
<title id="t">PN-05 consentgraph architecture</title>
<desc id="d">Blueprint: fixtures feed generateCandidates, then loadGraph with a threshold into SQLite holding record, edge and consent tables. profileFor and audienceFor read it, and profileFor feeds evaluate. Readouts: 1,432 records, 472 people, marketing precision 1.0000.</desc>
