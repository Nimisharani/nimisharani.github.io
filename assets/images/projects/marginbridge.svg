<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-02 marginbridge architecture</title>
<desc>Blueprint schematic: generator.py produces a transaction list consumed by three functions in bridge.py, which feed the demo.py report. Tests score against ground truth.</desc>
<defs>
<pattern id="mn" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#EAF3FB" stroke-opacity="0.05" stroke-width="1"/></pattern>
<pattern id="mj" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#EAF3FB" stroke-opacity="0.09" stroke-width="1"/></pattern>
<marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#EAF3FB" fill-opacity="0.8"/></marker>
<marker id="ac" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9FDBFF"/></marker>
<style>
text{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace;font-size:9px;letter-spacing:0.06em;fill:#EAF3FB;text-transform:uppercase}
.t{font-size:10px}
.s{fill-opacity:0.7}
.a{fill:#9FDBFF}
.m{text-anchor:middle}
.b{fill:none;stroke:#EAF3FB;stroke-opacity:0.7;stroke-width:1}
.k{fill:none;stroke:#9FDBFF;stroke-width:1}
.l{fill:none;stroke:#EAF3FB;stroke-opacity:0.8;stroke-width:1}
.d{fill:none;stroke:#EAF3FB;stroke-opacity:0.5;stroke-width:1;stroke-dasharray:4 3}
</style>
</defs>
<rect width="640" height="360" fill="#0D3B66"/>
<rect width="640" height="360" fill="url(#mn)"/>
<rect width="640" height="360" fill="url(#mj)"/>
<rect x="16" y="16" width="608" height="20" class="b"/>
<text x="24" y="30" class="t">PN-02 · MARGINBRIDGE · PRICE-VOLUME-MIX BRIDGE + ELASTICITY</text>

<rect x="16" y="150" width="140" height="56" class="k"/>
<text x="86" y="168" class="m t a">GENERATOR.PY</text>
<text x="86" y="182" class="m s">SYNTHETIC TXNS</text>
