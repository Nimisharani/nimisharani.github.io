<polyline points="256,100 256,242" class="l"/>
<line x1="256" y1="100" x2="282" y2="100" class="l" marker-end="url(#aw)"/>
<line x1="256" y1="178" x2="282" y2="178" class="k" marker-end="url(#ac)"/>
<line x1="256" y1="242" x2="282" y2="242" class="l" marker-end="url(#aw)"/>

<line x1="460" y1="100" x2="488" y2="100" class="l"/>
<line x1="460" y1="242" x2="488" y2="242" class="l"/>
<line x1="488" y1="100" x2="488" y2="242" class="l"/>
<line x1="460" y1="178" x2="502" y2="178" class="k" marker-end="url(#ac)"/>

<rect x="504" y="150" width="120" height="56" class="k"/>
