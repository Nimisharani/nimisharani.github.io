<rect x="272" y="56" width="200" height="214" class="d"/>
<text x="284" y="68" class="s">BRIDGE.PY</text>

<rect x="284" y="78" width="176" height="44" class="b"/>
<text x="372" y="97" class="m t">PRICE_VOLUME_MIX</text>
<text x="372" y="111" class="m s">PRICE / VOLUME / MIX</text>

<rect x="284" y="153" width="176" height="50" class="k"/>
