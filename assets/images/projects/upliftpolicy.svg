<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-03 upliftpolicy architecture</title>
<desc>Blueprint schematic: generator feeds study split, which branches to uplift learners and cross-fitted nuisances. Learners feed policy. Policy and nuisances feed evaluation, which feeds the report. Readouts: +4.47 pts uplift-ranked and -0.23 pts churn-ranked retention.</desc>
