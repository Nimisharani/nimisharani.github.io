<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img">
<title>PN-07 dagcache: schematic</title>
<desc>Pipeline definitions and params feed a KeyBuilder with the Hasher. Keys feed status and the Runner. A hit restores outputs; a miss runs the stage and stores outputs and a manifest. Results go to the lock file and local cache, which syncs with a remote. gc and lineage read the cache.</desc>
